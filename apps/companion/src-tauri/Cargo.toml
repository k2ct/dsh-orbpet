[package]
name = "dsh-companion"
version = "0.1.0"
description = "DSH-managed Windows desktop companion with balance, pet, and ACP chat"
authors = ["DSH Companion contributors"]
edition = "2021"
license = "MIT"
default-run = "dsh-companion"

[lib]
name = "dsh_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
