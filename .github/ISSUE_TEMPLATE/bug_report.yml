name: Bug report
description: Report a reproducible defect in the desktop companion
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, cookies, tokens, or private account data."
  - type: input
    id: version
    attributes:
      label: Companion version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed all credentials and private data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
